<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tanımlı Ürünler - Mobil İşletme</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-modal {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .active-scale:active { transform: scale(0.96); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between max-w-md mx-auto relative overflow-x-hidden border-x border-slate-800/50 shadow-2xl">

    <!-- OTURUM KONTROL OVERLAY -->
    <div id="authCheckOverlay" class="fixed inset-0 z-50 glass-modal flex flex-col justify-center items-center p-6 transition-all duration-300">
        <div class="w-16 h-16 rounded-2xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 text-2xl font-bold mb-4 animate-pulse">
            <i class="fa-solid fa-lock"></i>
        </div>
        <h2 class="text-base font-semibold text-white tracking-tight">Oturum Kontrol Ediliyor</h2>
        <p class="text-xs text-slate-400 mt-1">Yetkiniz doğrulanıyor, lütfen bekleyin...</p>
    </div>

    <!-- HEADER -->
    <header class="p-4 pt-6 glass-card border-b border-slate-800 sticky top-0 z-30">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <a href="satinalma.html" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/80 flex items-center justify-center transition-all active-scale" title="Geri Dön">
                    <i class="fa-solid fa-chevron-left text-sm"></i>
                </a>
                <div>
                    <h2 class="text-xs font-bold text-slate-100 flex items-center gap-1.5">
                        <i class="fa-solid fa-tags text-blue-400"></i>
                        <span>TANIMLI ÜRÜNLER</span>
                    </h2>
                    <p id="userEmailTag" class="text-[10px] text-slate-400 truncate max-w-[130px]"></p>
                </div>
            </div>
            
            <button type="button" id="btnLogout" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-red-500/20 hover:text-red-400 text-slate-400 border border-slate-700/80 flex items-center justify-center transition-all active-scale" title="Çıkış Yap">
                <i class="fa-solid fa-right-from-bracket text-xs"></i>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 p-4 pb-24 overflow-y-auto space-y-3">
        
        <!-- Ürün Ekle Butonu -->
        <button type="button" id="btnOpenModal" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 active-scale text-white font-semibold rounded-xl text-xs transition-all shadow-lg shadow-blue-600/20 flex items-center justify-center space-x-2">
            <i class="fa-solid fa-plus text-xs"></i>
            <span>Ürün Ekle</span>
        </button>

        <!-- Dinamik Filtreleme (Arama Çubuğu) -->
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-xs"></i>
            <input type="text" id="searchInput" placeholder="Ürün kodu, adı veya mal grubu ara..." class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl pl-9 pr-4 py-2.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors">
        </div>

        <!-- Ürün Listesi Alanı -->
        <div id="productList" class="space-y-3 pt-1">
            <div class="glass-card p-6 rounded-2xl border border-slate-800 text-center flex flex-col items-center justify-center min-h-[200px]">
                <div class="w-12 h-12 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-500 text-lg mb-2">
                    <i class="fa-solid fa-box-open"></i>
                </div>
                <h4 class="text-xs font-semibold text-slate-300">Yükleniyor...</h4>
                <p class="text-[11px] text-slate-500 mt-1">Tanımlı ürünler getiriliyor.</p>
            </div>
        </div>
    </main>

    <!-- ÜRÜN EKLE / DÜZENLE MODALI -->
    <div id="productModal" class="fixed inset-0 z-50 glass-modal flex items-center justify-center p-4 hidden overflow-y-auto">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-5 w-full max-w-sm shadow-2xl space-y-4 my-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 id="modalTitle" class="font-bold text-slate-200 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-circle-plus text-blue-400"></i> Yeni Ürün Tanımla
                </h3>
                <button type="button" id="btnCloseModal" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-sm"></i></button>
            </div>

            <!-- Düzenleme için gizli ID alanı -->
            <input type="hidden" id="editProductId" value="">

            <div class="space-y-3 text-xs">
                <!-- Ürün Kodu -->
                <div>
                    <label class="text-[11px] text-slate-400 mb-1 block">Ürün Kodu</label>
                    <input type="text" id="pCode" placeholder="Örn: URUN-001" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 focus:outline-none focus:border-blue-500">
                </div>

                <!-- Ürün Tanımı -->
                <div>
                    <label class="text-[11px] text-slate-400 mb-1 block">Ürün Tanımı</label>
                    <input type="text" id="pName" placeholder="Örn: Alüminyum Profil" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 focus:outline-none focus:border-blue-500">
                </div>

                <!-- Mal Grubu -->
                <div>
                    <label class="text-[11px] text-slate-400 mb-1 block">Mal Grubu</label>
                    <select id="pGroup" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 focus:outline-none focus:border-blue-500">
                        <option value="HAM MALZEME">HAM MALZEME</option>
                        <option value="YARI MAMÜL">YARI MAMÜL</option>
                        <option value="SARF MALZEME">SARF MALZEME</option>
                    </select>
                </div>

                <!-- Ölçü Birimi -->
                <div>
                    <label class="text-[11px] text-slate-400 mb-1 block">Ölçü Birimi</label>
                    <select id="pUnit" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 focus:outline-none focus:border-blue-500">
                        <option value="ADET">ADET</option>
                        <option value="METRE">METRE</option>
                        <option value="CM">CM</option>
                        <option value="MM">MM</option>
                        <option value="KG">KG</option>
                        <option value="GR">GR</option>
                        <option value="LİTRE">LİTRE</option>
                        <option value="PAKET">PAKET</option>
                    </select>
                </div>

                <!-- Görsel (Base64) -->
                <div>
                    <label class="text-[11px] text-slate-400 mb-1 block">Ürün Görseli</label>
                    <input type="file" id="pImageFile" accept="image/*" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-400 text-[11px] file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-[11px] file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500">
                </div>
            </div>

            <!-- Kaydet / Güncelle Butonu -->
            <button type="button" id="btnSaveProduct" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl text-xs transition-colors shadow-lg shadow-blue-600/20">
                Kaydet
            </button>
        </div>
    </div>

    <!-- FIREBASE CONFIG & SCRIPT -->
    <script src="firebase-config.js"></script>
    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let auth = null;
        let db = null;
        let productsCache = []; // Filtreleme için tüm ürünleri hafızada tutacağız

        async function initApp() {
            if (typeof firebaseConfig === 'undefined') {
                window.location.href = "index.html";
                return;
            }
            const app = !getApps().length ? initializeApp(firebaseConfig) : getApps()[0];
            auth = getAuth(app);
            db = getFirestore(app);

            // Üyelik Kontrolü (Auth Guard)
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    document.getElementById('authCheckOverlay').classList.add('hidden');
                    document.getElementById('userEmailTag').textContent = user.email;
                    loadProducts();
                } else {
                    window.location.href = "index.html";
                }
            });
        }

        // Çıkış İşlemi
        document.getElementById('btnLogout').addEventListener('click', async () => {
            if (auth) { await signOut(auth); window.location.href = "index.html"; }
        });

        // Modal Yönetimi (Yeni Ürün Ekle Modu)
        const modal = document.getElementById('productModal');
        document.getElementById('btnOpenModal').addEventListener('click', () => {
            document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-circle-plus text-blue-400"></i> Yeni Ürün Tanımla`;
            document.getElementById('editProductId').value = "";
            document.getElementById('pCode').value = "";
            document.getElementById('pName').value = "";
            document.getElementById('pGroup').value = "HAM MALZEME";
            document.getElementById('pUnit').value = "ADET";
            document.getElementById('pImageFile').value = "";
            document.getElementById('btnSaveProduct').textContent = "Kaydet";
            modal.classList.remove('hidden');
        });

        document.getElementById('btnCloseModal').addEventListener('click', () => modal.classList.add('hidden'));

        // Ürün Kaydet veya Güncelle
        document.getElementById('btnSaveProduct').addEventListener('click', async () => {
            const editId = document.getElementById('editProductId').value.trim();
            const code = document.getElementById('pCode').value.trim();
            const name = document.getElementById('pName').value.trim();
            const group = document.getElementById('pGroup').value;
            const unit = document.getElementById('pUnit').value;
            const fileInput = document.getElementById('pImageFile');

            if (!code || !name) {
                alert("Lütfen Ürün Kodu ve Ürün Tanımı alanlarını doldurun!");
                return;
            }

            let base64Image = "";
            if (fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                base64Image = await toBase64(file);
            }

            try {
                document.getElementById('btnSaveProduct').textContent = "İşlem yapılıyor...";

                if (editId) {
                    // --- GÜNCELLEME İŞLEMİ ---
                    const updateData = {
                        urunKodu: code,
                        urunTanimi: name,
                        malGrubu: group,
                        olcuBirimi: unit
                    };
                    // Yeni görsel seçildiyse güncellemeye dahil et
                    if (base64Image) {
                        updateData.gorsel = base64Image;
                    }

                    await updateDoc(doc(db, "tanimli_urunler", editId), updateData);
                } else {
                    // --- YENİ EKLEME İŞLEMİ ---
                    await addDoc(collection(db, "tanimli_urunler"), {
                        urunKodu: code,
                        urunTanimi: name,
                        malGrubu: group,
                        olcuBirimi: unit,
                        gorsel: base64Image,
                        createdAt: new Date()
                    });
                }

                modal.classList.add('hidden');
                document.getElementById('btnSaveProduct').textContent = "Kaydet";

            } catch (err) {
                console.error("Kayıt/Güncelleme hatası:", err);
                alert("İşlem sırasında hata oluştu: " + err.message);
                document.getElementById('btnSaveProduct').textContent = "Kaydet";
            }
        });

        // Dosyayı Base64 formatına çeviren yardımcı fonksiyon
        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        // Firestore'dan Ürünleri Anlık Çekme ve Cacheleme
        function loadProducts() {
            const q = query(collection(db, "tanimli_urunler"));
            onSnapshot(q, (snapshot) => {
                productsCache = [];
                snapshot.forEach((docSnap) => {
                    productsCache.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderProductList(productsCache);
            });
        }

        // Listeyi ekrana basan fonksiyon (Filtreleme desteği ile)
        function renderProductList(items) {
            const listContainer = document.getElementById('productList');
            listContainer.innerHTML = "";

            if (items.length === 0) {
                listContainer.innerHTML = `
                    <div class="glass-card p-6 rounded-2xl border border-slate-800 text-center flex flex-col items-center justify-center min-h-[200px]">
                        <div class="w-12 h-12 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-500 text-lg mb-2">
                            <i class="fa-solid fa-box-open"></i>
                        </div>
                        <h4 class="text-xs font-semibold text-slate-300">Ürün Bulunamadı</h4>
                        <p class="text-[11px] text-slate-500 mt-1">Arama kriterine uygun ürün yok veya liste boş.</p>
                    </div>
                `;
                return;
            }

            items.forEach((p) => {
                let badgeColor = "bg-blue-500/10 text-blue-400 border-blue-500/20";
                if (p.malGrubu === "YARI MAMÜL") badgeColor = "bg-amber-500/10 text-amber-400 border-amber-500/20";
                if (p.malGrubu === "SARF MALZEME") badgeColor = "bg-purple-500/10 text-purple-400 border-purple-500/20";

                const itemCard = `
                    <div class="glass-card p-3.5 rounded-2xl border border-slate-800 flex items-center justify-between space-x-3">
                        <div class="flex items-center space-x-3 min-w-0 flex-1">
                            <div class="w-14 h-14 rounded-xl bg-slate-900 border border-slate-700 flex-shrink-0 overflow-hidden flex items-center justify-center">
                                ${p.gorsel ? `<img src="${p.gorsel}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-image text-slate-600 text-lg"></i>`}
                            </div>
                            <div class="min-w-0 flex-1">
                                <div class="flex items-center space-x-2 mb-0.5">
                                    <span class="text-[10px] font-mono text-blue-400 font-semibold">${p.urunKodu}</span>
                                    <span class="text-[9px] px-2 py-0.5 rounded-full border ${badgeColor}">${p.malGrubu}</span>
                                </div>
                                <h4 class="text-xs font-bold text-slate-100 truncate">${p.urunTanimi}</h4>
                                <p class="text-[10px] text-slate-400 mt-0.5">Birim: <span class="text-slate-200 font-medium">${p.olcuBirimi}</span></p>
                            </div>
                        </div>

                        <!-- Düzenle ve Sil Butonları -->
                        <div class="flex items-center space-x-1.5 flex-shrink-0">
                            <button type="button" onclick="window.editProductItem('${p.id}')" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-blue-600/20 hover:text-blue-400 text-slate-400 border border-slate-700/80 flex items-center justify-center transition-all active-scale" title="Düzenle">
                                <i class="fa-solid fa-pen-to-square text-xs"></i>
                            </button>
                            <button type="button" onclick="window.deleteProductItem('${p.id}')" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-red-500/20 hover:text-red-400 text-slate-400 border border-slate-700/80 flex items-center justify-center transition-all active-scale" title="Sil">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
                listContainer.innerHTML += itemCard;
            });
        }

        // Dinamik Arama / Filtreleme Olayı
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const queryText = e.target.value.toLowerCase().trim();
            const filtered = productsCache.filter(p => 
                (p.urunKodu && p.urunKodu.toLowerCase().includes(queryText)) ||
                (p.urunTanimi && p.urunTanimi.toLowerCase().includes(queryText)) ||
                (p.malGrubu && p.malGrubu.toLowerCase().includes(queryText))
            );
            renderProductList(filtered);
        });

        // Düzenleme Fonksiyonunu Global Kılma
        window.editProductItem = function(id) {
            const product = productsCache.find(p => p.id === id);
            if (!product) return;

            document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-pen-to-square text-blue-400"></i> Ürünü Düzenle`;
            document.getElementById('editProductId').value = product.id;
            document.getElementById('pCode').value = product.urunKodu || "";
            document.getElementById('pName').value = product.urunTanimi || "";
            document.getElementById('pGroup').value = product.malGrubu || "HAM MALZEME";
            document.getElementById('pUnit').value = product.olcuBirimi || "ADET";
            document.getElementById('pImageFile').value = ""; // Yeni görsel isteğe bağlı
            document.getElementById('btnSaveProduct').textContent = "Değişiklikleri Kaydet";
            
            modal.classList.remove('hidden');
        };

        // Silme Fonksiyonunu Global Kılma
        window.deleteProductItem = async function(id) {
            if (confirm("Bu ürünü silmek istediğinize emin misiniz?")) {
                try {
                    await deleteDoc(doc(db, "tanimli_urunler", id));
                } catch (err) {
                    console.error("Silme hatası:", err);
                    alert("Ürün silinirken bir hata oluştu: " + err.message);
                }
            }
        };

        initApp();
    </script>
</body>
</html>
