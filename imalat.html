<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İmalat Takip - Mobil İşletme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-modal {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .active-scale:active { transform: scale(0.96); }

        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            .print-area { display: block !important; width: 100%; position: absolute; top: 0; left: 0; background: white; color: black; padding: 10px; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between max-w-md mx-auto relative overflow-x-hidden border-x border-slate-800/50 shadow-2xl">

    <!-- OTURUM KONTROL OVERLAY -->
    <div id="authCheckOverlay" class="fixed inset-0 z-50 glass-modal flex flex-col justify-center items-center p-6 transition-all duration-300">
        <div class="w-16 h-16 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 text-2xl font-bold mb-4 animate-pulse">
            <i class="fa-solid fa-lock"></i>
        </div>
        <h2 class="text-base font-semibold text-white tracking-tight">Oturum Kontrol Ediliyor</h2>
        <p id="loadingSubText" class="text-xs text-slate-400 mt-1">Yetkiniz doğrulanıyor, lütfen bekleyin...</p>
    </div>

    <!-- HEADER -->
    <header class="p-3 pt-5 glass-card border-b border-slate-800 sticky top-0 z-30 no-print">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <a href="index.html" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/80 flex items-center justify-center transition-all active-scale" title="Ana Sayfa">
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                </a>
                <div>
                    <h2 class="text-xs font-bold text-slate-100 flex items-center gap-1.5">
                        <i class="fa-solid fa-industry text-indigo-400"></i>
                        <span>İMALAT LİSTESİ</span>
                    </h2>
                    <p id="userEmailTag" class="text-[10px] text-slate-400 truncate max-w-[110px]">Kullanıcı</p>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <a href="imalatrecetesi.html" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-[10px] font-semibold rounded-xl border border-slate-700 flex items-center gap-1 transition-all active-scale shadow-sm">
                    <i class="fa-solid fa-file-invoice text-indigo-400"></i>
                    <span>Reçeteler</span>
                </a>
                <button type="button" id="btnLogout" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-red-500/20 hover:text-red-400 text-slate-400 border border-slate-700/80 flex items-center justify-center transition-all active-scale" title="Çıkış Yap">
                    <i class="fa-solid fa-right-from-bracket text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 p-4 pb-24 overflow-y-auto space-y-3 no-print">
        
        <div class="flex items-center justify-between pt-1">
            <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Üretime Alınan Siparişler</h3>
            <span id="siparisCount" class="text-[10px] bg-indigo-500/10 text-indigo-400 px-2 py-0.5 rounded-full border border-indigo-500/20">0 Sipariş</span>
        </div>

        <div id="imalatListContainer" class="space-y-3">
            <div class="glass-card p-6 rounded-2xl border border-slate-800 text-center flex flex-col items-center justify-center min-h-[200px]">
                <div class="w-12 h-12 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-500 text-lg mb-2">
                    <i class="fa-solid fa-spinner animate-spin"></i>
                </div>
                <h4 class="text-xs font-semibold text-slate-300">İmalat Listesi Yükleniyor...</h4>
            </div>
        </div>
    </main>

    <!-- DETAY MODALI -->
    <div id="detayModal" class="fixed inset-0 z-50 glass-modal flex items-center justify-center p-3 hidden overflow-y-auto no-print">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-4 w-full max-w-lg shadow-2xl space-y-3 my-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-slate-100 text-xs flex items-center gap-1.5">
                    <i class="fa-solid fa-circle-info text-indigo-400"></i> Sipariş Üretim Detayları
                </h3>
                <button type="button" id="btnCloseModal" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div id="modalContentBody" class="space-y-2.5 max-h-[350px] overflow-y-auto pr-1 text-xs"></div>
            <button type="button" id="btnCloseModalBtn" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium rounded-xl text-xs transition-all border border-slate-700 active-scale">
                Kapat
            </button>
        </div>
    </div>

    <!-- İMALAT FORMU YAZDIRMA MODALI (A4 YATAY) -->
    <div id="printModal" class="fixed inset-0 z-50 bg-slate-950/90 flex flex-col items-center justify-center p-2 hidden overflow-auto">
        <div class="bg-white text-slate-900 w-full max-w-6xl rounded-2xl p-6 shadow-2xl space-y-4 my-auto relative">
            <div class="flex justify-between items-center border-b pb-3 no-print">
                <h3 class="font-bold text-lg text-indigo-900"><i class="fa-solid fa-print"></i> İmalat Üretim Formu (A4 Yatay Düzen)</h3>
                <div class="flex space-x-2">
                    <button onclick="window.print()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold hover:bg-indigo-700"><i class="fa-solid fa-print"></i> Yazdır</button>
                    <button onclick="document.getElementById('printModal').classList.add('hidden')" class="px-4 py-2 bg-slate-200 text-slate-800 rounded-xl text-xs font-bold hover:bg-slate-300">Kapat</button>
                </div>
            </div>

            <!-- TABLO ALANI (GÖRSELDEKİ FORMAT) -->
            <div id="printModalBody" class="print-area overflow-x-auto text-[10px]"></div>
        </div>
    </div>

    <!-- FIREBASE & SCRIPT -->
    <script src="firebase-config.js"></script>
    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, deleteDoc, updateDoc, addDoc, getDocs, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let auth = null;
        let db = null;
        let imalatCache = {};
        let imalatReceteleriCache = [];
        let authChecked = false;

        async function initApp() {
            if (typeof firebaseConfig === 'undefined') { return; }

            try {
                const app = !getApps().length ? initializeApp(firebaseConfig) : getApps()[0];
                auth = getAuth(app);
                db = getFirestore(app);

                onAuthStateChanged(auth, (user) => {
                    if (!authChecked) {
                        authChecked = true;
                        document.getElementById('authCheckOverlay').classList.add('hidden');
                        if (user) { document.getElementById('userEmailTag').textContent = user.email; }
                        loadImalatListesi();
                        loadImalatReceteleri();
                    }
                });

                setTimeout(() => {
                    if (!authChecked) {
                        authChecked = true;
                        document.getElementById('authCheckOverlay').classList.add('hidden');
                        loadImalatListesi();
                        loadImalatReceteleri();
                    }
                }, 3000);

            } catch (err) {
                console.error("Init error:", err);
                document.getElementById('authCheckOverlay').classList.add('hidden');
                loadImalatListesi();
                loadImalatReceteleri();
            }
        }

        document.getElementById('btnLogout').addEventListener('click', async () => {
            if (auth) { await signOut(auth); window.location.href = "index.html"; }
        });

        async function loadImalatReceteleri() {
            try {
                const snap = await getDocs(collection(db, "imalat_receteleri"));
                imalatReceteleriCache = [];
                snap.forEach(d => imalatReceteleriCache.push(d.data()));
            } catch (e) {
                console.error("İmalat reçeteleri yüklenemedi:", e);
            }
        }

        function loadImalatListesi() {
            try {
                const q = query(collection(db, "tamamlanan_siparisler"), orderBy("createdAt", "desc"));
                onSnapshot(q, (snapshot) => {
                    const container = document.getElementById('imalatListContainer');
                    container.innerHTML = "";
                    document.getElementById('siparisCount').textContent = `${snapshot.size} Sipariş`;
                    imalatCache = {};

                    if (snapshot.empty) {
                        container.innerHTML = `
                            <div class="glass-card p-6 rounded-2xl border border-slate-800 text-center flex flex-col items-center justify-center min-h-[200px]">
                                <div class="w-12 h-12 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-500 text-lg mb-2">
                                    <i class="fa-solid fa-industry"></i>
                                </div>
                                <h4 class="text-xs font-semibold text-slate-300">İmalat Listesi Boş</h4>
                                <p class="text-[11px] text-slate-500 mt-1">Henüz tamamlanıp üretime aktarılan sipariş bulunmuyor.</p>
                            </div>
                        `;
                        return;
                    }

                    snapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        const docId = docSnap.id;
                        imalatCache[docId] = data;

                        const tarihStr = data.createdAt?.toDate ? data.createdAt.toDate().toLocaleString('tr-TR') : 'Tarih Yok';
                        let toplamKalemSayisi = data.kalemler ? data.kalemler.length : 0;
                        const isIptal = data.durum === "İPTAL";

                        let kalemlerOzet = "";
                        if (data.kalemler && Array.isArray(data.kalemler)) {
                            data.kalemler.forEach((k, idx) => {
                                if(idx < 2) {
                                    let eklentiText = k.eklenti ? ` | ${k.eklenti}` : '';
                                    kalemlerOzet += `<div class="text-[10px] text-slate-300 truncate">• ${k.urunTanimi} (EN:${k.en}, BOY:${k.boy}, AD:${k.adet})${eklentiText}</div>`;
                                }
                            });
                            if(toplamKalemSayisi > 2) {
                                kalemlerOzet += `<div class="text-[9px] text-indigo-400 font-medium mt-0.5">+ ${toplamKalemSayisi - 2} kalem daha...</div>`;
                            }
                        }

                        let durumBadge = isIptal ? 
                            `<span class="text-[10px] font-bold text-rose-400 bg-rose-500/10 border border-rose-500/20 px-2 py-0.5 rounded-md">İPTAL EDİLDİ</span>` :
                            `<span class="text-[10px] font-bold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded-md">ÜRETİMDE</span>`;

                        const cardHtml = `
                            <div class="glass-card p-3.5 rounded-2xl border ${isIptal ? 'border-rose-900/50 opacity-75' : 'border-slate-800'} space-y-2.5">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center space-x-2">
                                        <span class="text-xs font-mono font-bold text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 px-2 py-0.5 rounded-md">${data.siparisKodu}</span>
                                        ${durumBadge}
                                    </div>
                                    <div class="flex items-center space-x-1">
                                        ${!isIptal ? `
                                            <button type="button" onclick="window.iptalEtSiparis('${docId}')" class="px-2 py-1 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-lg text-[10px] font-semibold transition-all active-scale" title="İptal Et">İptal</button>
                                        ` : ''}
                                        <button type="button" onclick="window.deleteImalatSiparis('${docId}')" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-red-500/20 hover:text-red-400 text-slate-500 border border-slate-700 flex items-center justify-center active-scale" title="Sil"><i class="fa-solid fa-trash-can text-xs"></i></button>
                                    </div>
                                </div>

                                <div class="space-y-1 bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80">
                                    <span class="text-[9px] font-semibold text-slate-400 uppercase tracking-wider block">Sipariş Kalemleri (${toplamKalemSayisi}):</span>
                                    ${kalemlerOzet}
                                </div>

                                <div class="flex items-center justify-between pt-1 gap-2">
                                    ${!isIptal ? `
                                        <button type="button" onclick="window.openImalatFormu('${docId}')" class="flex-1 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-[10px] font-bold shadow-md transition-all active-scale flex items-center justify-center gap-1">
                                            <i class="fa-solid fa-file-lines"></i> İmalat Formu Oluştur
                                        </button>
                                    ` : ''}
                                    <button type="button" onclick="window.openDetayModal('${docId}')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-xl text-[10px] font-semibold transition-all active-scale">
                                        Detay <i class="fa-solid fa-chevron-right ml-0.5"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                        container.innerHTML += cardHtml;
                    });
                });
            } catch (e) {
                console.error("İmalat listesi yükleme hatası:", e);
            }
        }

        function evalFormul(expression, EN, BOY, ADET) {
            try {
                let expr = expression.toUpperCase();
                expr = expr.replace(/EN/g, EN);
                expr = expr.replace(/BOY/g, BOY);
                expr = expr.replace(/ADET/g, ADET);
                return Math.round(Function(`'use strict'; return (${expr})`)() * 100) / 100;
            } catch (e) {
                return EN; // Hata durumunda net ölçüyü döndür
            }
        }

        window.openImalatFormu = function(id) {
            const data = imalatCache[id];
            if (!data) return;

            let netRowsHtml = "";
            let imalatRowsHtml = "";
            let sira = 1;

            if (data.kalemler && Array.isArray(data.kalemler)) {
                data.kalemler.forEach(k => {
                    const en = Number(k.en || 0);
                    const boy = Number(k.boy || 0);
                    const adet = Number(k.adet || 1);

                    // Reçeteden formülleri bulalım
                    let receteObj = imalatReceteleriCache.find(r => r.urunId === k.urunId || r.urunTanimi === k.urunTanimi);
                    
                    let kasaEn = en, kasaBoy = boy;
                    let kanatBoy = boy;
                    let tulBoy = boy;
                    let ipBoy = boy;

                    if (receteObj && receteObj.recete) {
                        receteObj.recete.forEach(rec => {
                            let val = evalFormul(rec.formul, en, boy, adet);
                            let mAdi = rec.malzemeAdi.toUpperCase();
                            if (mAdi.includes("KASA EN")) kasaEn = val;
                            if (mAdi.includes("KASA BOY")) kasaBoy = val;
                            if (mAdi.includes("KANAT")) kanatBoy = val;
                            if (mAdi.includes("TÜL") || mAdi.includes("TUL")) tulBoy = val;
                            if (mAdi.includes("İP") || mAdi.includes("IP")) ipBoy = val;
                        });
                    }

                    // 1. Üst Tablo (Net Ölçüler)
                    netRowsHtml += `
                        <tr class="border-b text-center">
                            <td class="p-1.5 border">${sira}</td>
                            <td class="p-1.5 border">${k.en}</td>
                            <td class="p-1.5 border">${k.boy}</td>
                            <td class="p-1.5 border">${k.renk || '-'}</td>
                            <td class="p-1.5 border">KALIN SERİ</td>
                            <td class="p-1.5 border">YATAY</td>
                            <td class="p-1.5 border">TEK KANAT</td>
                            <td class="p-1.5 border">${k.tul || 'STANDART'}</td>
                            <td class="p-1.5 border">${k.eklenti || '-'}</td>
                            <td class="p-1.5 border font-bold">${k.adet}</td>
                            <td class="p-1.5 border">-</td>
                        </tr>
                    `;

                    // 2. Alt Tablo (İmalat Kesim Detayı - Akıllı Hesaplama)
                    imalatRowsHtml += `
                        <tr class="border-b text-center">
                            <td class="p-1.5 border">${sira}</td>
                            <td class="p-1.5 border font-mono bg-indigo-50 font-bold">${kasaEn}</td>
                            <td class="p-1.5 border font-mono bg-indigo-50 font-bold">${kasaBoy}</td>
                            <td class="p-1.5 border font-mono">${adet}</td>
                            <td class="p-1.5 border font-mono">${kanatBoy}</td>
                            <td class="p-1.5 border font-mono">${tulBoy}</td>
                            <td class="p-1.5 border font-mono">${adet}</td>
                            <td class="p-1.5 border font-mono">STANDART</td>
                            <td class="p-1.5 border font-mono">${adet}</td>
                            <td class="p-1.5 border font-mono">${ipBoy}</td>
                            <td class="p-1.5 border font-mono">4</td>
                            <td class="p-1.5 border font-mono">15 cm</td>
                        </tr>
                    `;
                    sira++;
                });
            }

            const tarihStr = data.createdAt?.toDate ? data.createdAt.toDate().toLocaleString('tr-TR') : new Date().toLocaleString('tr-TR');

            const printBody = document.getElementById('printModalBody');
            printBody.innerHTML = `
                <!-- BAŞLIK -->
                <div class="flex justify-between items-center border-b-2 border-slate-800 pb-2 mb-3">
                    <div>
                        <h1 class="text-lg font-extrabold tracking-wider text-slate-900">ADA SİNEKLİK <span class="text-sm font-normal text-slate-600">| ÜRETİM FORMU</span></h1>
                        <p class="text-[9px] text-slate-500">Tarih: (Güncellendi) ${tarihStr}</p>
                    </div>
                    <div class="text-right">
                        <span class="text-[10px] text-slate-500 uppercase block">Sipariş No</span>
                        <strong class="text-lg font-mono text-rose-600">${data.siparisKodu}</strong>
                    </div>
                </div>

                <div class="flex justify-between items-center bg-slate-100 p-2 rounded mb-3 text-[11px] font-semibold border">
                    <div>MÜŞTERİ: ${data.olusturan || 'GENEL MÜŞTERİ'}</div>
                    <div>TELEFON: -</div>
                    <div>TOPLAM SATIŞ: - TL</div>
                </div>

                <!-- 1. SİPARİŞ LİSTESİ (NET ÖLÇÜLER) -->
                <div class="mb-4">
                    <div class="bg-slate-800 text-white px-2 py-1 text-[10px] font-bold uppercase rounded-t">
                        1. SİPARİŞ LİSTESİ (NET ÖLÇÜLER)
                    </div>
                    <table class="w-full border-collapse border border-slate-400">
                        <thead>
                            <tr class="bg-slate-100 text-slate-800">
                                <th class="border p-1">NO</th>
                                <th class="border p-1">EN</th>
                                <th class="border p-1">BOY</th>
                                <th class="border p-1">RENK</th>
                                <th class="border p-1">SERİ</th>
                                <th class="border p-1">YÖN</th>
                                <th class="border p-1">MODEL</th>
                                <th class="border p-1">TÜL</th>
                                <th class="border p-1">EKLENTİ</th>
                                <th class="border p-1">ADET</th>
                                <th class="border p-1">NOT</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${netRowsHtml}
                        </tbody>
                    </table>
                </div>

                <!-- 2. İMALAT KESİM DETAYI (AKILLI HESAPLAMA) -->
                <div>
                    <div class="bg-emerald-800 text-white px-2 py-1 text-[10px] font-bold uppercase rounded-t flex justify-between items-center">
                        <span>2. İMALAT KESİM DETAYI (AKILLI HESAPLAMA)</span>
                        <span class="text-[9px] font-normal">SINIRSIZ ZİNCİRLEME İŞLEM MANTIĞI UYGULANMIŞTIR</span>
                    </div>
                    <table class="w-full border-collapse border border-slate-400">
                        <thead>
                            <tr class="bg-emerald-50 text-slate-800">
                                <th class="border p-1">NO</th>
                                <th class="border p-1 bg-indigo-100">KASA EN</th>
                                <th class="border p-1 bg-indigo-100">KASA BOY</th>
                                <th class="border p-1 bg-indigo-100">KASA EN BOY ADET</th>
                                <th class="border p-1 bg-indigo-100">KANAT BOY</th>
                                <th class="border p-1 bg-emerald-100">TÜL BOY</th>
                                <th class="border p-1 bg-emerald-100">KANAT ADET</th>
                                <th class="border p-1 bg-emerald-100">TÜL TP</th>
                                <th class="border p-1 bg-emerald-100">TÜL ADET</th>
                                <th class="border p-1 bg-amber-100">İP BOY</th>
                                <th class="border p-1 bg-amber-100">İP ADET</th>
                                <th class="border p-1 bg-amber-100">PERÇİN ARALIK</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${imalatRowsHtml}
                        </tbody>
                    </table>
                </div>
            `;

            document.getElementById('printModal').classList.remove('hidden');
        };

        window.openDetayModal = function(id) {
            const data = imalatCache[id];
            if (!data) return;

            const bodyContainer = document.getElementById('modalContentBody');
            bodyContainer.innerHTML = "";

            if (data.kalemler && Array.isArray(data.kalemler)) {
                data.kalemler.forEach((k, index) => {
                    bodyContainer.innerHTML += `
                        <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-1">
                            <h5 class="font-bold text-slate-100 text-xs">${index + 1}. ${k.urunTanimi}</h5>
                            <div class="flex flex-wrap gap-1 text-[9px]">
                                <span class="bg-slate-900 border border-slate-700 text-slate-300 px-1.5 py-0.5 rounded font-mono">EN: ${k.en}</span>
                                <span class="bg-slate-900 border border-slate-700 text-slate-300 px-1.5 py-0.5 rounded font-mono">BOY: ${k.boy}</span>
                                <span class="bg-slate-900 border border-slate-700 text-slate-300 px-1.5 py-0.5 rounded font-mono">ADET: ${k.adet}</span>
                                <span class="bg-blue-500/10 text-blue-400 border border-blue-500/20 px-1.5 py-0.5 rounded">${k.tul}</span>
                                <span class="bg-purple-500/10 text-purple-400 border border-purple-500/20 px-1.5 py-0.5 rounded">${k.renk}</span>
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('detayModal').classList.remove('hidden');
        };

        window.iptalEtSiparis = async function(id) {
            const data = imalatCache[id];
            if (!data) return;

            if (!confirm(`Sipariş Kodu: ${data.siparisKodu}\nBu siparişi iptal etmek ve kullanılan malzemeleri depoya geri yüklemek istediğinize emin misiniz?`)) return;

            try {
                let toplamKullanilanMalzemeler = {};
                if (data.kalemler && Array.isArray(data.kalemler)) {
                    data.kalemler.forEach(item => {
                        if (item.hesaplananMalzemeler && Array.isArray(item.hesaplananMalzemeler)) {
                            item.hesaplananMalzemeler.forEach(m => {
                                toplamKullanilanMalzemeler[m.urunKodu] = (toplamKullanilanMalzemeler[m.urunKodu] || 0) + Number(m.hesaplananMiktar);
                            });
                        }
                    });
                }

                let iadeKalemleri = [];
                for (const [urunKodu, miktar] of Object.entries(toplamKullanilanMalzemeler)) {
                    iadeKalemleri.push({
                        urunKodu: urunKodu,
                        urunTanimi: "Sipariş İptal İadesi",
                        malGrubu: "İADE",
                        olcuBirimi: "Ad/Mt",
                        teslimAlinan: Math.abs(miktar),
                        toplamTutar: 0
                    });
                }

                if (iadeKalemleri.length > 0) {
                    await addDoc(collection(db, "satinalma_talepleri"), {
                        seriNo: `IADE-${data.siparisKodu}`,
                        durum: "Tamamlandı",
                        kalemler: iadeKalemleri,
                        olusturan: auth.currentUser ? auth.currentUser.email : 'Kullanıcı',
                        guncellenmeTarihi: new Date(),
                        createdAt: new Date()
                    });
                }

                await updateDoc(doc(db, "tamamlanan_siparisler", id), { durum: "İPTAL" });
                alert("Sipariş iptal edildi ve malzemeler depoya geri yüklendi!");
            } catch (e) {
                alert("İptal hatası: " + e.message);
            }
        };

        document.getElementById('btnCloseModal').addEventListener('click', () => document.getElementById('detayModal').classList.add('hidden'));
        document.getElementById('btnCloseModalBtn').addEventListener('click', () => document.getElementById('detayModal').classList.add('hidden'));

        window.deleteImalatSiparis = async function(id) {
            if (confirm("Bu imalat kaydını tamamen silmek istediğinize emin misiniz?")) {
                try {
                    await deleteDoc(doc(db, "tamamlanan_siparisler", id));
                } catch (e) {
                    alert("Silme hatası: " + e.message);
                }
            }
        };

        initApp();
    </script>
</body>
</html>
