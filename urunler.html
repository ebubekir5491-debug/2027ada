<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sipariş Ürünleri - Mobil İşletme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-modal {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .active-scale:active { transform: scale(0.96); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between max-w-md mx-auto relative overflow-x-hidden border-x border-slate-800/50 shadow-2xl">

    <!-- OTURUM KONTROL OVERLAY -->
    <div id="authCheckOverlay" class="fixed inset-0 z-50 glass-modal flex flex-col justify-center items-center p-6 transition-all duration-300">
        <div class="w-16 h-16 rounded-2xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 text-2xl font-bold mb-4 animate-pulse">
            <i class="fa-solid fa-lock"></i>
        </div>
        <h2 class="text-base font-semibold text-white tracking-tight">Oturum Kontrol Ediliyor</h2>
        <p id="loadingSubText" class="text-xs text-slate-400 mt-1">Yetkiniz doğrulanıyor, lütfen bekleyin...</p>
    </div>

    <!-- HEADER -->
    <header class="p-4 pt-6 glass-card border-b border-slate-800 sticky top-0 z-30">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <a href="siparis.html" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/80 flex items-center justify-center transition-all active-scale" title="Geri Dön">
                    <i class="fa-solid fa-chevron-left text-sm"></i>
                </a>
                <div>
                    <h2 class="text-xs font-bold text-slate-100 flex items-center gap-1.5">
                        <i class="fa-solid fa-tags text-blue-400"></i>
                        <span>ÜRÜN REÇETELERİ</span>
                    </h2>
                    <p id="userEmailTag" class="text-[10px] text-slate-400 truncate max-w-[110px]">Kullanıcı</p>
                </div>
            </div>

            <button type="button" id="btnLogout" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-red-500/20 hover:text-red-400 text-slate-400 border border-slate-700/80 flex items-center justify-center transition-all active-scale" title="Çıkış Yap">
                <i class="fa-solid fa-right-from-bracket text-xs"></i>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 p-4 pb-24 overflow-y-auto space-y-3">
        
        <button type="button" id="btnOpenModal" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 active-scale text-white font-semibold rounded-xl text-xs transition-all shadow-lg shadow-blue-600/20 flex items-center justify-center space-x-2">
            <i class="fa-solid fa-plus text-xs"></i>
            <span>YENİ ÜRÜN REÇETESİ EKLE</span>
        </button>

        <div class="flex items-center justify-between pt-1">
            <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Kayıtlı Reçeteler</h3>
            <span id="urunCount" class="text-[10px] bg-blue-500/10 text-blue-400 px-2 py-0.5 rounded-full border border-blue-500/20">0 Ürün</span>
        </div>

        <div id="siparisListContainer" class="space-y-3">
            <div class="glass-card p-6 rounded-2xl border border-slate-800 text-center flex flex-col items-center justify-center min-h-[200px]">
                <div class="w-12 h-12 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-500 text-lg mb-2">
                    <i class="fa-solid fa-spinner animate-spin"></i>
                </div>
                <h4 class="text-xs font-semibold text-slate-300">Yükleniyor...</h4>
            </div>
        </div>
    </main>

    <!-- ÜRÜN EKLEME / DÜZENLEME MODALI -->
    <div id="productModal" class="fixed inset-0 z-50 glass-modal flex items-center justify-center p-3 hidden overflow-y-auto">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-4 w-full max-w-lg shadow-2xl space-y-4 my-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 id="modalTitle" class="font-bold text-slate-100 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-calculator text-blue-400"></i> Yeni Ürün & Formüllü Reçete
                </h3>
                <button type="button" id="btnCloseModal" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>

            <div class="space-y-3 text-xs max-h-[400px] overflow-y-auto pr-1">
                <!-- Ürün Tanımı -->
                <div>
                    <label class="text-[11px] text-slate-400 mb-1 block">Ürün Tanımı</label>
                    <input type="text" id="pTanimi" placeholder="Örn: Plise Sineklik Kasalı" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 focus:outline-none focus:border-blue-500">
                </div>

                <!-- Formüllü Ürün Kodları, Renk ve Formül -->
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="text-[11px] text-slate-400">Malzeme Kodları, Renk ve Formül</label>
                        <button type="button" id="btnAddRow" class="text-[10px] text-blue-400 hover:text-blue-300 font-semibold"><i class="fa-solid fa-plus"></i> Satır Ekle</button>
                    </div>
                    <p class="text-[10px] text-slate-500 mb-2">Değişkenler: <code class="text-blue-400 font-bold">EN</code>, <code class="text-blue-400 font-bold">BOY</code>, <code class="text-blue-400 font-bold">ADET</code>. Renk boş bırakılırsa her renkte geçerli olur.</p>

                    <div id="kodAdetContainer" class="space-y-2">
                        <div class="grid grid-cols-12 gap-1.5 row-item items-center">
                            <input type="text" placeholder="Ürün Kodu" class="col-span-3 bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-slate-100 text-xs focus:outline-none focus:border-blue-500 row-kod">
                            <select class="col-span-3 bg-slate-950 border border-slate-800 rounded-xl px-1.5 py-2 text-slate-300 text-[11px] focus:outline-none focus:border-blue-500 row-renk">
                                <option value="">Tüm Renkler (Boş)</option>
                                <option value="BEYAZ">BEYAZ</option>
                                <option value="ANTRASİT">ANTRASİT</option>
                                <option value="MAUN">MAUN</option>
                                <option value="VİZON">VİZON</option>
                                <option value="KOYU KAHVE">KOYU KAHVE</option>
                                <option value="ALTIN MEŞE">ALTIN MEŞE</option>
                            </select>
                            <input type="text" placeholder="Formül (örn: EN*2)" class="col-span-5 bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 text-slate-100 text-xs focus:outline-none focus:border-blue-500 row-formul">
                            <button type="button" onclick="this.parentElement.remove()" class="col-span-1 h-8 rounded-xl bg-red-500/10 text-red-400 border border-red-500/20 flex items-center justify-center"><i class="fa-solid fa-trash-can text-xs"></i></button>
                        </div>
                    </div>
                </div>

                <!-- Görsel -->
                <div>
                    <label class="text-[11px] text-slate-400 mb-1 block">Ürün Görseli</label>
                    <input type="file" id="pImageFile" accept="image/*" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-400 text-[11px] file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-[11px] file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500">
                </div>
            </div>

            <!-- Kaydet Butonu -->
            <button type="button" id="btnSaveProduct" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-xs transition-all shadow-lg shadow-blue-600/20 flex items-center justify-center gap-1.5 active-scale">
                <i class="fa-solid fa-check"></i> Reçeteyi Kaydet
            </button>
        </div>
    </div>

    <!-- FIREBASE & SCRIPT -->
    <script src="firebase-config.js"></script>
    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, doc, onSnapshot, query, orderBy, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let auth = null;
        let db = null;
        let editingReceteId = null;

        async function initApp() {
            if (typeof firebaseConfig === 'undefined') {
                document.getElementById('loadingSubText').textContent = "firebase-config.js bulunamadı!";
                return;
            }

            try {
                const app = !getApps().length ? initializeApp(firebaseConfig) : getApps()[0];
                auth = getAuth(app);
                db = getFirestore(app);

                onAuthStateChanged(auth, (user) => {
                    document.getElementById('authCheckOverlay').classList.add('hidden');
                    if (user) {
                        document.getElementById('userEmailTag').textContent = user.email;
                    }
                    loadSiparisUrunleri();
                });

                setTimeout(() => {
                    document.getElementById('authCheckOverlay').classList.add('hidden');
                    loadSiparisUrunleri();
                }, 3000);

            } catch (err) {
                console.error("Init error:", err);
                document.getElementById('authCheckOverlay').classList.add('hidden');
                loadSiparisUrunleri();
            }
        }

        document.getElementById('btnLogout').addEventListener('click', async () => {
            if (auth) { await signOut(auth); window.location.href = "index.html"; }
        });

        const modal = document.getElementById('productModal');

        // Yeni Ekle Butonu
        document.getElementById('btnOpenModal').addEventListener('click', () => {
            editingReceteId = null;
            document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-calculator text-blue-400"></i> Yeni Ürün & Formüllü Reçete`;
            document.getElementById('pTanimi').value = "";
            document.getElementById('pImageFile').value = "";
            document.getElementById('kodAdetContainer').innerHTML = `
                <div class="grid grid-cols-12 gap-1.5 row-item items-center">
                    <input type="text" placeholder="Ürün Kodu" class="col-span-3 bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-slate-100 text-xs focus:outline-none focus:border-blue-500 row-kod">
                    <select class="col-span-3 bg-slate-950 border border-slate-800 rounded-xl px-1.5 py-2 text-slate-300 text-[11px] focus:outline-none focus:border-blue-500 row-renk">
                        <option value="">Tüm Renkler (Boş)</option>
                        <option value="BEYAZ">BEYAZ</option>
                        <option value="ANTRASİT">ANTRASİT</option>
                        <option value="MAUN">MAUN</option>
                        <option value="VİZON">VİZON</option>
                        <option value="KOYU KAHVE">KOYU KAHVE</option>
                        <option value="ALTIN MEŞE">ALTIN MEŞE</option>
                    </select>
                    <input type="text" placeholder="Formül (örn: EN*2)" class="col-span-5 bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 text-slate-100 text-xs focus:outline-none focus:border-blue-500 row-formul">
                    <button type="button" onclick="this.parentElement.remove()" class="col-span-1 h-8 rounded-xl bg-red-500/10 text-red-400 border border-red-500/20 flex items-center justify-center"><i class="fa-solid fa-trash-can text-xs"></i></button>
                </div>
            `;
            document.getElementById('btnSaveProduct').innerHTML = `<i class="fa-solid fa-check"></i> Reçeteyi Kaydet`;
            modal.classList.remove('hidden');
        });

        document.getElementById('btnCloseModal').addEventListener('click', () => modal.classList.add('hidden'));

        // Dinamik Formül Satırı Ekleme
        document.getElementById('btnAddRow').addEventListener('click', () => {
            const container = document.getElementById('kodAdetContainer');
            const rowDiv = document.createElement('div');
            rowDiv.className = "grid grid-cols-12 gap-1.5 row-item items-center";
            rowDiv.innerHTML = `
                <input type="text" placeholder="Ürün Kodu" class="col-span-3 bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-slate-100 text-xs focus:outline-none focus:border-blue-500 row-kod">
                <select class="col-span-3 bg-slate-950 border border-slate-800 rounded-xl px-1.5 py-2 text-slate-300 text-[11px] focus:outline-none focus:border-blue-500 row-renk">
                    <option value="">Tüm Renkler (Boş)</option>
                    <option value="BEYAZ">BEYAZ</option>
                    <option value="ANTRASİT">ANTRASİT</option>
                    <option value="MAUN">MAUN</option>
                    <option value="VİZON">VİZON</option>
                    <option value="KOYU KAHVE">KOYU KAHVE</option>
                    <option value="ALTIN MEŞE">ALTIN MEŞE</option>
                </select>
                <input type="text" placeholder="Formül (örn: EN*2)" class="col-span-5 bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 text-slate-100 text-xs focus:outline-none focus:border-blue-500 row-formul">
                <button type="button" onclick="this.parentElement.remove()" class="col-span-1 h-8 rounded-xl bg-red-500/10 text-red-400 border border-red-500/20 flex items-center justify-center"><i class="fa-solid fa-trash-can text-xs"></i></button>
            `;
            container.appendChild(rowDiv);
        });

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        // Reçete Düzenleme Penceresini Açma
        window.editRecete = function(id, encodedData) {
            const data = JSON.parse(decodeURIComponent(encodedData));
            editingReceteId = id;

            document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-pen-to-square text-blue-400"></i> Reçeteyi Düzenle`;
            document.getElementById('pTanimi').value = data.urunTanimi || '';
            document.getElementById('pImageFile').value = '';

            const container = document.getElementById('kodAdetContainer');
            container.innerHTML = '';

            if (data.recete && data.recete.length > 0) {
                data.recete.forEach(item => {
                    const rowDiv = document.createElement('div');
                    rowDiv.className = "grid grid-cols-12 gap-1.5 row-item items-center";
                    
                    const renkOptions = ["", "BEYAZ", "ANTRASİT", "MAUN", "VİZON", "KOYU KAHVE", "ALTIN MEŞE"];
                    let optionsHtml = `<option value="">Tüm Renkler (Boş)</option>`;
                    renkOptions.slice(1).forEach(r => {
                        const sel = (item.renk === r) ? "selected" : "";
                        optionsHtml += `<option value="${r}" ${sel}>${r}</option>`;
                    });

                    rowDiv.innerHTML = `
                        <input type="text" value="${item.urunKodu || ''}" placeholder="Ürün Kodu" class="col-span-3 bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-slate-100 text-xs focus:outline-none focus:border-blue-500 row-kod">
                        <select class="col-span-3 bg-slate-950 border border-slate-800 rounded-xl px-1.5 py-2 text-slate-300 text-[11px] focus:outline-none focus:border-blue-500 row-renk">
                            <option value="" ${!item.renk ? "selected" : ""}>Tüm Renkler (Boş)</option>
                            <option value="BEYAZ" ${item.renk === "BEYAZ" ? "selected" : ""}>BEYAZ</option>
                            <option value="ANTRASİT" ${item.renk === "ANTRASİT" ? "selected" : ""}>ANTRASİT</option>
                            <option value="MAUN" ${item.renk === "MAUN" ? "selected" : ""}>MAUN</option>
                            <option value="VİZON" ${item.renk === "VİZON" ? "selected" : ""}>VİZON</option>
                            <option value="KOYU KAHVE" ${item.renk === "KOYU KAHVE" ? "selected" : ""}>KOYU KAHVE</option>
                            <option value="ALTIN MEŞE" ${item.renk === "ALTIN MEŞE" ? "selected" : ""}>ALTIN MEŞE</option>
                        </select>
                        <input type="text" value="${item.formul || ''}" placeholder="Formül" class="col-span-5 bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 text-slate-100 text-xs focus:outline-none focus:border-blue-500 row-formul">
                        <button type="button" onclick="this.parentElement.remove()" class="col-span-1 h-8 rounded-xl bg-red-500/10 text-red-400 border border-red-500/20 flex items-center justify-center"><i class="fa-solid fa-trash-can text-xs"></i></button>
                    `;
                    container.appendChild(rowDiv);
                });
            }

            document.getElementById('btnSaveProduct').innerHTML = `<i class="fa-solid fa-pen-to-square"></i> Reçeteyi Güncelle`;
            modal.classList.remove('hidden');
        };

        // Kaydet veya Güncelle İşlemi
        document.getElementById('btnSaveProduct').addEventListener('click', async () => {
            const tanimi = document.getElementById('pTanimi').value.trim();
            const fileInput = document.getElementById('pImageFile');

            if (!tanimi) {
                alert("Lütfen ürün tanımını giriniz!");
                return;
            }

            const rowItems = document.querySelectorAll('.row-item');
            let receteListesi = [];
            rowItems.forEach(row => {
                const kod = row.querySelector('.row-kod').value.trim();
                const renk = row.querySelector('.row-renk').value;
                const formul = row.querySelector('.row-formul').value.trim();
                if (kod && formul) {
                    receteListesi.push({ urunKodu: kod, renk: renk, formul: formul });
                }
            });

            if (receteListesi.length === 0) {
                alert("Lütfen en az bir malzeme için Ürün Kodu ve Formül giriniz!");
                return;
            }

            try {
                document.getElementById('btnSaveProduct').textContent = "Kaydediliyor...";

                let updatePayload = {
                    urunTanimi: tanimi,
                    recete: receteListesi
                };

                if (fileInput.files && fileInput.files[0]) {
                    updatePayload.gorsel = await toBase64(fileInput.files[0]);
                }

                if (editingReceteId) {
                    await updateDoc(doc(db, "siparis_urunleri", editingReceteId), updatePayload);
                    alert("Reçete başarıyla güncellendi!");
                } else {
                    updatePayload.createdAt = new Date();
                    if (!updatePayload.gorsel) updatePayload.gorsel = "";
                    await addDoc(collection(db, "siparis_urunleri"), updatePayload);
                    alert("Yeni reçete başarıyla kaydedildi!");
                }

                modal.classList.add('hidden');
                document.getElementById('btnSaveProduct').innerHTML = `<i class="fa-solid fa-check"></i> Reçeteyi Kaydet`;

            } catch (err) {
                console.error("Kayıt/Güncelleme hatası:", err);
                alert("İşlem sırasında hata oluştu: " + err.message);
                document.getElementById('btnSaveProduct').innerHTML = `<i class="fa-solid fa-check"></i> Reçeteyi Kaydet`;
            }
        });

        // Reçeteleri Listeleme
        function loadSiparisUrunleri() {
            try {
                const q = query(collection(db, "siparis_urunleri"), orderBy("createdAt", "desc"));
                onSnapshot(q, (snapshot) => {
                    const container = document.getElementById('siparisListContainer');
                    container.innerHTML = "";
                    document.getElementById('urunCount').textContent = `${snapshot.size} Reçete`;

                    if (snapshot.empty) {
                        container.innerHTML = `
                            <div class="glass-card p-6 rounded-2xl border border-slate-800 text-center flex flex-col items-center justify-center min-h-[200px]">
                                <div class="w-12 h-12 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-500 text-lg mb-2">
                                    <i class="fa-solid fa-calculator"></i>
                                </div>
                                <h4 class="text-xs font-semibold text-slate-300">Reçete Bulunamadı</h4>
                                <p class="text-[11px] text-slate-500 mt-1">Henüz formüllü ürün reçetesi eklenmedi.</p>
                            </div>
                        `;
                        return;
                    }

                    snapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        const docId = docSnap.id;
                        const encodedJson = encodeURIComponent(JSON.stringify(data));
                        
                        let receteHtml = "";
                        if (data.recete && Array.isArray(data.recete)) {
                            data.recete.forEach(item => {
                                const renkBadge = item.renk ? `<span class="text-[9px] bg-purple-500/10 text-purple-400 border border-purple-500/20 px-1.5 py-0.5 rounded font-medium">${item.renk}</span>` : `<span class="text-[9px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded">Tüm Renkler</span>`;
                                
                                receteHtml += `<div class="text-[10px] bg-slate-900 border border-slate-800 text-slate-300 px-2 py-1 rounded-md font-mono flex justify-between items-center gap-1">
                                    <span class="text-blue-400 font-bold">${item.urunKodu}</span>
                                    ${renkBadge}
                                    <span class="text-amber-400 font-semibold">${item.formul}</span>
                                </div>`;
                            });
                        }

                        const cardHtml = `
                            <div class="glass-card p-3.5 rounded-2xl border border-slate-800 flex items-start justify-between space-x-3">
                                <div class="flex items-start space-x-3 min-w-0 flex-1">
                                    <div class="w-14 h-14 rounded-xl bg-slate-900 border border-slate-700 flex-shrink-0 overflow-hidden flex items-center justify-center">
                                        ${data.gorsel ? `<img src="${data.gorsel}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-image text-slate-600 text-lg"></i>`}
                                    </div>
                                    <div class="min-w-0 flex-1 space-y-1">
                                        <h4 class="text-xs font-bold text-slate-100 truncate">${data.urunTanimi}</h4>
                                        <div class="space-y-1">
                                            ${receteHtml}
                                        </div>
                                    </div>
                                </div>
                                <div class="flex flex-col space-y-1.5 flex-shrink-0">
                                    <button type="button" onclick="window.editRecete('${docId}', '${encodedJson}')" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-blue-500/20 hover:text-blue-400 text-slate-400 border border-slate-700/80 flex items-center justify-center active-scale" title="Düzenle">
                                        <i class="fa-solid fa-pen-to-square text-xs"></i>
                                    </button>
                                    <button type="button" onclick="window.deleteRecete('${docId}')" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-red-500/20 hover:text-red-400 text-slate-500 border border-slate-700/80 flex items-center justify-center active-scale" title="Sil">
                                        <i class="fa-solid fa-trash-can text-xs"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                        container.innerHTML += cardHtml;
                    });
                });
            } catch (e) {
                console.error("Listeleme hatası:", e);
            }
        }

        window.deleteRecete = async function(id) {
            if (confirm("Bu ürün reçetesini silmek istediğinize emin misiniz?")) {
                try {
                    await deleteDoc(doc(db, "siparis_urunleri", id));
                } catch (e) {
                    alert("Silme hatası: " + e.message);
                }
            }
        };

        initApp();
    </script>
</body>
</html>
